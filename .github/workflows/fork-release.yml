name: Fork release

# CLI, desktop, and standalone Android release for this private fork, adapted
# from upstream's release.yml/release-desktop.yml:
#   - Triggered by pushing a `v*.*.*` tag (or workflow_dispatch), not on every
#     push to main. macOS hosted runners bill at a real multiplier on
#     a private repo, so routine pushes don't pay that cost.
#   - Runners are swapped from upstream's blacksmith-* fleet (a paid runner
#     service this fork has no access to) to standard GitHub-hosted runners.
#   - No Clerk/Cloudflare/Vercel: those back the hosted web app and T3 Connect
#     relay, not the update/install mechanism, so clerk_* and relay_url are
#     passed empty and relay_client_tracing is disabled.
#   - No npm publish: `t3 update` pulls CLI archives straight from the GitHub
#     Release (see packages/shared/src/cliRelease.ts), so npm is only needed
#     for the initial `npx t3` bootstrap, which this fork does not provide.
#   - Signing secrets (CSC_*, APPLE_*) are intentionally left unset;
#     release-desktop.yml already falls back to unsigned/ad-hoc builds when
#     they're absent.
#   - Android builds locally with Gradle, with upstream Expo OTA updates disabled.

on:
  pull_request:
    paths:
      - .github/workflows/fork-release.yml
      - apps/mobile/app.config.ts
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 1.2.3)"
        required: true
        type: string
      build_only:
        description: "Build artifacts without publishing a release"
        type: boolean
        default: false

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: resolve
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            raw="0.0.0"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${DISPATCH_VERSION:?version input is required for manual runs}"
          else
            raw="${GITHUB_REF_NAME}"
          fi

          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $raw (expected X.Y.Z)" >&2
            exit 1
          fi
          tag="v$version"
          previous_tag="$(git tag --list 'v*.*.*' | grep -Fxv "$tag" | sort -V | tail -n1 || true)"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ""
      T3CODE_CLERK_JWT_TEMPLATE: ""
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ""
      T3CODE_RELAY_URL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux x64
      runner: ubuntu-latest
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true

  desktop_linux_arm64:
    name: Desktop Linux arm64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux arm64
      runner: ubuntu-24.04-arm
      platform: linux
      target: AppImage
      arch: arm64
      rust_target: aarch64-unknown-linux-gnu
      resource_key: linux-arm64
      cli_archive: true

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS arm64
      runner: macos-14
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true

  android:
    name: Android APK (ARM64)
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: production
      CI: "1"
      NODE_OPTIONS: --max-old-space-size=3072
      T3CODE_ANDROID_PACKAGE: com.oudwins.t3code
      T3CODE_ANDROID_VERSION_CODE: ${{ github.run_number }}
      T3CODE_MOBILE_VERSION: ${{ needs.preflight.outputs.version }}
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      MOBILE_VERSION_POLICY: appVersion
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Generate Android project
        working-directory: apps/mobile
        run: vp exec expo prebuild --clean --platform android --no-install

      # Expo's template signs release builds with its fixed development key.
      - name: Build standalone APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: >-
          ./gradlew :app:assembleRelease
          -PreactNativeArchitectures=arm64-v8a
          '-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m'
          --no-daemon --max-workers=2

      - name: Verify standalone APK
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$build_tools/apksigner" verify "$apk"
          test "$(apkanalyzer manifest application-id "$apk")" = "$T3CODE_ANDROID_PACKAGE"
          test "$(apkanalyzer manifest version-code "$apk")" = "$T3CODE_ANDROID_VERSION_CODE"
          test "$(apkanalyzer manifest version-name "$apk")" = "$T3CODE_MOBILE_VERSION"
          unzip -Z1 "$apk" | grep -Fx 'assets/index.android.bundle'

      - name: Prepare release asset
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          mkdir -p release-assets
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "release-assets/T3-Code-${RELEASE_VERSION}-android-arm64.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [preflight, desktop_linux_x64, desktop_linux_arm64, desktop_mac_arm64, android]
    if: github.event_name != 'pull_request' && !inputs.build_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download all CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: release-assets

      - name: Write CLI and Android checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=(t3-*.tar.gz t3-*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No CLI archives were produced." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" ./*.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Merge macOS updater manifests
        run: |
          shopt -s nullglob
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
              rm -f "$x64_manifest"
            fi
          done

      - id: release_files
        name: Resolve release asset list
        shell: bash
        run: |
          {
            echo 'files<<EOF'
            echo 'release-assets/*.dmg'
            echo 'release-assets/*.zip'
            echo 'release-assets/*.AppImage'
            echo 'release-assets/*.deb'
            echo 'release-assets/*.apk'
            echo 'release-assets/*.blockmap'
            echo 'release-assets/*.yml'
            echo 'release-assets/*.tar.gz'
            echo 'release-assets/SHA256SUMS'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: "T3 Code v${{ needs.preflight.outputs.version }}"
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: false
          make_latest: true
          files: ${{ steps.release_files.outputs.files }}
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Publish first release
        if: needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: "T3 Code v${{ needs.preflight.outputs.version }}"
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: ${{ steps.release_files.outputs.files }}
          fail_on_unmatched_files: true
          token: ${{ github.token }}
