name: Fork daily release

# Once a day, if main has commits since the latest vX.Y.Z tag, dispatch
# fork-release.yml with the next patch version. Tags pushed with GITHUB_TOKEN
# don't trigger other workflows, but workflow_dispatch does, so we dispatch.
# fork-release.yml creates the tag itself when it publishes, so a failed build
# leaves no tag and the next day's run retries the same version.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: fork-daily-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch release if main changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: .github
      - name: Dispatch fork release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [[ -z "$latest_tag" ]]; then
            echo "No vX.Y.Z tag found; cut the first release manually." >&2
            exit 1
          fi

          ahead="$(git rev-list --count "$latest_tag..HEAD")"
          if [[ "$ahead" -eq 0 ]]; then
            echo "main has no changes since $latest_tag; skipping."
            exit 0
          fi

          IFS=. read -r major minor patch <<< "${latest_tag#v}"
          next="$major.$minor.$((patch + 1))"
          echo "main is $ahead commit(s) ahead of $latest_tag; releasing $next."
          gh workflow run fork-release.yml --ref main -f version="$next"
